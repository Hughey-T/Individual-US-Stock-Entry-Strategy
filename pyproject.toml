[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "entry-strategy"
version = "3.0.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["build>=1.2", "jsonschema>=4.20", "mypy>=1.10", "ruff>=0.5", "types-jsonschema>=4.20", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.setuptools.data-files]
"share/entry-strategy" = ["instructions/custom-gpt-entry-strategy.md"]
