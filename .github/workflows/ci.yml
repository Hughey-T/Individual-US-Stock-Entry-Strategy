name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '${{ matrix.python }}', cache: pip}
      - run: python -m pip install -e '.[dev]'
      - run: python -m unittest discover -s tests -v
      - run: python -m entry_strategy.validation --all
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: python scripts/repository_audit.py
      - run: python -m build
      - run: python -m pip install --force-reinstall dist/*.whl
      - run: python -c "import entry_strategy; import yaml; yaml.safe_load(open('openapi.yaml', encoding='utf-8'))"
      - run: git diff --check
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t entry-strategy:local .
      - run: scripts/docker-smoke.sh entry-strategy:local
