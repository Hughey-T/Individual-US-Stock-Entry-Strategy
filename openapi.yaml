openapi: 3.1.0
info:
  title: Entry Strategy Validation API
  version: 1.0.0
  description: 状態検証だけを行い、注文執行は扱わない。正本は instructions/custom-gpt-entry-strategy.md。
paths:
  /validate:
    post:
      summary: Entry Strategy状態を検証
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: './schemas/entry-strategy-state.schema.json'
      responses:
        '200':
          description: 検証結果
          content:
            application/json:
              schema:
                type: object
                required: [valid, errors]
                properties:
                  valid: {type: boolean}
                  errors: {type: array, items: {type: string}}
